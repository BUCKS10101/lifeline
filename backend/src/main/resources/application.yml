spring:
  application:
    name: personal-os-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personal_os}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    # Entities are mapped to DTOs inside service transactions; no database session during view rendering.
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Blank (the default) means no auth, matching the local Docker Redis, which has none.
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  mail:
    # Defaults match the local Mailhog container exactly (no auth, no TLS). In production these point at a real
    # provider's SMTP (e.g. Resend: host smtp.resend.com, port 587, username "resend", password an API key,
    # auth/starttls true) through SmtpEmailSender, which already reads mail config through JavaMailSender.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}

  session:
    timeout: 7d
    redis:
      # Indexed repository lets us find and revoke every session of a user.
      repository-type: indexed

server:
  # Hosting platforms (e.g. Render) assign their own port via $PORT; local development has none set, so 8080 applies.
  port: ${PORT:8080}
  # Behind a TLS-terminating reverse proxy in production, this makes the framework honour X-Forwarded-* headers
  # for scheme/host/port. With no such proxy (plain local development) it is simply never exercised.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        # Only health is public-safe; info/metrics/env/beans/mappings/configprops are never exposed.
        include: health
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@personal-os.local}
    # "smtp" (default, local Mailhog) or "resend" (production, Resend's HTTP API over HTTPS — required where the
    # host blocks outbound SMTP ports, e.g. Render's free tier).
    provider: ${MAIL_PROVIDER:smtp}
    resend:
      api-key: ${RESEND_API_KEY:}
